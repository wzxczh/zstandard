name: Build EXE with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade PyQt6 openpyxl xlrd python-docx openai nuitka zstandard

      - name: Install UPX
        run: |
          winget install UPX.UPX -e --silent

      - name: Build with Nuitka
        run: |
          python -m nuitka --onefile --windows-disable-console --windows-icon-from-ico=ico.ico --enable-plugin=upx --lto=yes --strip --no-pyi-files --remove-output --jobs=auto --nofollow-import-to=test,unittest,__pycache__ --prefer-source-code assignflow1.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: assignflow1.exe
          path: assignflow1.exe

